# v2design.ivmotorclass.com — copia del front para el nuevo diseño.
# Aplicación SEPARADA: código, base de datos y APP_KEY propios.
# La producción (/var/www/motorclass) no se ve afectada por nada de aquí.

# --- HTTP: sólo sirve el reto ACME y redirige el resto a HTTPS
server {
    listen 80;
    server_name v2design.ivmotorclass.com;

    # la renovación del certificado necesita este camino en claro
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/motorclass-v2/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://v2design.ivmotorclass.com$request_uri; }
}

# --- HTTPS
server {
    listen 443 ssl http2;
    server_name v2design.ivmotorclass.com;

    # sólo local, para capturas y pruebas internas
    listen 127.0.0.1:8081;

    root /var/www/motorclass-v2/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/v2design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2design/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLv2:10m;
    ssl_session_timeout 10m;

    # Copia de trabajo: que Google no la indexe (contenido duplicado de producción).
    # A propósito NO enviamos HSTS aquí: es un entorno de trabajo, no queremos fijarlo.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # nginx.conf turns gzip on but leaves gzip_types commented out, and the
    # default is text/html alone — so every stylesheet on this site was being
    # served uncompressed. Measured: /css/car.css went out at 24,132 bytes with no
    # Content-Encoding while the HTML beside it was gzipped. 564 KB of CSS and
    # 108 KB of JS in the repo. Scoped to this server block, so the production
    # site's configuration is not touched.
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-v2.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # Entorno de trabajo: el CSS y el JS cambian a diario, así que no se cachean.
    # Las imágenes sí, porque no las tocamos al iterar el diseño.
    location ~* \.(css|js)$ {
        expires -1;   # emite Cache-Control: no-cache
        access_log off;
    }
    # Imágenes y fuentes: el navegador guarda los bytes pero pregunta siempre.
    # Si no han cambiado recibe un 304 (barato) y si cambian las ve al instante.
    # Derived images are content-addressed: the filename is a hash of the source
    # path, its mtime, the width and the quality, so a changed photograph is a
    # different file and this can be cached for a year without ever going stale.
    # ^~ so it wins over the regex block below.
    location ^~ /storage/cache/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires -1;   # emite Cache-Control: no-cache
        access_log off;
    }

    access_log /var/log/nginx/v2design.access.log;
    error_log  /var/log/nginx/v2design.error.log;
}
