# ivmotorclass.com — served by the v2 application (installed by deploy/cutover.sh).
# The old site (/var/www/motorclass) stays untouched as the rollback: deploy/rollback.sh.
# Production's security headers and CSP are kept; v2's own rules come along
# (uploads never executed, gzip for CSS/JS/SVG, content-addressed image cache).
server {
    listen 80;
    server_name 213.199.39.241 ivmotorclass.com www.ivmotorclass.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/motorclass-v2/public; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://ivmotorclass.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name 213.199.39.241 ivmotorclass.com www.ivmotorclass.com;
    root /var/www/motorclass-v2/public;
    index index.php;
    charset utf-8;
    client_max_body_size 0;

    ssl_certificate /etc/letsencrypt/live/ivmotorclass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivmotorclass.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com;" always;

    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    # derived images are content-addressed: cached for a year
    location ^~ /storage/cache/ { expires 1y; add_header Cache-Control "public, immutable" always; access_log off; try_files $uri =404; }
    # nothing under /storage is ever executed: everything there came from a form
    location ^~ /storage/ {
        location ~ \.(?:php|phtml|php[0-9]|phar|pl|py|cgi|sh|htaccess)$ { deny all; }
        expires 30d;
        try_files $uri =404;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-v2.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;
    }
    location ~ /\.(?!well-known).* { deny all; }
    # CSS/JS carry ?v=<mtime> (VersionedUrlGenerator): a change is a new URL
    location ~* \.(css|js|woff2?|ttf|eot)$ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(png|jpe?g|gif|ico|svg|webp)$ { expires 7d; access_log off; }

    access_log /var/log/nginx/ivmotorclass.access.log;
    error_log  /var/log/nginx/ivmotorclass.error.log;
}
