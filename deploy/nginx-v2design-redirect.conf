# v2design.ivmotorclass.com was the design copy; since the launch it only redirects.
server {
    listen 80;
    server_name v2design.ivmotorclass.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/motorclass-v2/public; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://ivmotorclass.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name v2design.ivmotorclass.com;
    ssl_certificate     /etc/letsencrypt/live/v2design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2design/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://ivmotorclass.com$request_uri;
}
